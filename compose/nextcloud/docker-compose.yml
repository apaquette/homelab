services:
  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - nextcloud_postgres
      - nextcloud_redis
    environment:
      POSTGRES_HOST: nextcloud_postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud_redis
    volumes:
      - /opt/nextcloud/html:/var/www/html
      - /mnt/myraid/Nextcloud:/var/www/html/data

  nextcloud_postgres:
    image: postgres:17
    container_name: nextcloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/nextcloud/postgres:/var/lib/postgresql/data

  nextcloud_redis:
    image: redis:7-alpine
    container_name: nextcloud_redis
    restart: unless-stopped
  nextcloud_cron:
    image: nextcloud:apache
    container_name: nextcloud_cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - nextcloud_postgres
      - nextcloud_redis
    volumes:
      - /opt/nextcloud/html:/var/www/html
      - /mnt/myraid/Nextcloud:/var/www/html/data
